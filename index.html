function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

let AC=null,muted=false;
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}
let unlocked=false;
const SILENT_WAV='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAAAA';
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  const a=ac();if(!a)return;
  try{const b=a.createBuffer(1,1,22050),sr=a.createBufferSource();sr.buffer=b;sr.connect(a.destination);sr.start(0);}catch(e){}
  if(!unlocked){
    unlocked=true;
    try{const el=new Audio(SILENT_WAV);el.volume=0.01;const p=el.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}
  }
}
function tone(f,d,type,v,delay,to){
  const a=AC;if(!a||muted)return;
  if(a.state!=='running'){try{a.resume();}catch(e){}}
  const t0=a.currentTime+(delay||0);
  const o=a.createOscillator(),gn=a.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f,t0);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);
  gn.gain.setValueAtTime(0.0001,t0);
  gn.gain.exponentialRampToValueAtTime(v||0.2,t0+0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(gn);gn.connect(a.destination);
  o.start(t0);o.stop(t0+d+0.03);
}

/* ---------- faces ---------- */
function heart(x,y,s){
  g.beginPath();g.moveTo(x,y+s*0.35);
  g.bezierCurveTo(x-s*1.1,y-s*0.25,x-s*0.45,y-s*0.95,x,y-s*0.35);
  g.bezierCurveTo(x+s*0.45,y-s*0.95,x+s*1.1,y-s*0.25,x,y+s*0.35);
  g.fill();
}
function badgeFace(kind,x,y,r,ink){
  g.save();
  g.strokeStyle=ink;g.fillStyle=ink;g.lineCap='round';g.lineJoin='round';
  g.lineWidth=Math.max(2,r*0.1);
  const ex=r*0.36,ey=-r*0.12,er=r*0.11;
  const dot=(px,py,pr)=>{g.beginPath();g.arc(px,py,pr,0,TAU);g.fill();};
  const line=(x1,y1,x2,y2)=>{g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();};
  switch(kind){
    case 'joy':
      g.beginPath();g.arc(x-ex,y+ey+er,er*1.4,Math.PI*1.05,Math.PI*1.95);g.stroke();
      g.beginPath();g.arc(x+ex,y+ey+er,er*1.4,Math.PI*1.05,Math.PI*1.95);g.stroke();
      g.beginPath();g.arc(x,y+r*0.08,r*0.46,Math.PI*0.08,Math.PI*0.92);g.closePath();g.fill();
      break;
    case 'sadness':
      dot(x-ex,y+ey,er);dot(x+ex,y+ey,er);
      line(x-ex-er*1.6,y+ey-er*2.2,x-ex+er*1.6,y+ey-er*3.6);
      line(x+ex+er*1.6,y+ey-er*2.2,x+ex-er*1.6,y+ey-er*3.6);
      g.beginPath();g.arc(x,y+r*0.68,r*0.3,Math.PI*1.2,Math.PI*1.8);g.stroke();
      g.fillStyle='#bfe3ff';dot(x-ex-er*0.4,y+ey+er*3.2,er*0.9);
      break;
    case 'rage':
      dot(x-ex,y+ey+er*0.4,er);dot(x+ex,y+ey+er*0.4,er);
      g.lineWidth=Math.max(3,r*0.13);
      line(x-ex-er*1.8,y+ey-er*3.0,x-ex+er*1.8,y+ey-er*1.4);
      line(x+ex+er*1.8,y+ey-er*3.0,x+ex-er*1.8,y+ey-er*1.4);
      g.lineWidth=Math.max(2,r*0.1);
      g.beginPath();g.arc(x,y+r*0.62,r*0.26,Math.PI*1.15,Math.PI*1.85);g.stroke();
      break;
    case 'calm':
      g.beginPath();g.arc(x-ex,y+ey,er*1.4,Math.PI*0.1,Math.PI*0.9);g.stroke();
      g.beginPath();g.arc(x+ex,y+ey,er*1.4,Math.PI*0.1,Math.PI*0.9);g.stroke();
      g.beginPath();g.arc(x,y+r*0.2,r*0.26,Math.PI*0.15,Math.PI*0.85);g.stroke();
      break;
    case 'love':
      g.fillStyle='#C2185B';
      heart(x-ex,y+ey,er*2.4);heart(x+ex,y+ey,er*2.4);
      g.beginPath();g.arc(x,y+r*0.18,r*0.3,Math.PI*0.12,Math.PI*0.88);g.strokeStyle='#C2185B';g.stroke();
      break;
    case 'fear':
      g.fillStyle='#fff';dot(x-ex,y+ey,er*1.7);dot(x+ex,y+ey,er*1.7);
      g.fillStyle='#241C38';dot(x-ex,y+ey,er*0.8);dot(x+ex,y+ey,er*0.8);
      g.beginPath();
      for(let i=0;i<=12;i++){const u=i/12;const px=x-r*0.3+u*r*0.6;const py=y+r*0.5+Math.sin(u*TAU*1.5)*r*0.07;i?g.lineTo(px,py):g.moveTo(px,py);}
      g.stroke();
      break;
    case 'confusion':
      g.fillStyle='#fff';dot(x-ex,y+ey,er*1.8);dot(x+ex,y+ey,er*1.2);
      g.fillStyle='#2b2340';dot(x-ex+er*0.3,y+ey,er*0.8);dot(x+ex-er*0.2,y+ey+er*0.2,er*0.6);
      g.beginPath();
      for(let i=0;i<=12;i++){const u=i/12;const px=x-r*0.3+u*r*0.6;const py=y+r*0.46+Math.sin(u*TAU*1.5)*r*0.08;i?g.lineTo(px,py):g.moveTo(px,py);}
      g.stroke();
      break;
  }
  g.restore();
}
function drawBadge(k,x,y,r){
  const P=COL[k];
  g.save();
  if(P.rainbow){
    for(let i=0;i<6;i++){g.beginPath();g.moveTo(x,y);g.arc(x,y,r,i/6*TAU-Math.PI/2,(i+1)/6*TAU-Math.PI/2);g.closePath();g.fillStyle=RAINBOW[i];g.fill();}
  }else{
    g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=P.main;g.fill();
  }
  g.beginPath();g.arc(x,y,r,0,TAU);g.strokeStyle=P.dark;g.lineWidth=Math.max(2,r*0.08);g.stroke();
  badgeFace(k,x,y,r,k==='fear'?'#ffffff':'#2b2340');
  g.restore();
}

/* ---------- rope ---------- */
class Rope{
  constructor(color,seg,w){
    this.color=color;this.n=9;this.seg=seg;this.w=w;
    this.nodes=[];for(let i=0;i<this.n;i++)this.nodes.push({x:0,y:0,px:0,py:0});
    this.attached=true;this.aAng=0;this.restOff={x:0,y:0};
    this.anchor={x:0,y:0};this.rest={x:0,y:0};
    this.pin=-1;this.pinX=0;this.pinY=0;
    this.seed=rnd(0,10);
    this.fz=[];for(let i=0;i<this.n*2;i++)this.fz.push(rnd(0,TAU));
    this.cj=[];for(let k=0;k<4;k++){const a=[];for(let i=0;i<this.n;i++)a.push({x:rnd(-1,1),y:rnd(-1,1)});this.cj.push(a);}
    this.sp=[];for(let i=0;i<46;i++)this.sp.push({i:Math.floor(rnd(0,this.n-1)),u:rnd(0,1),a:rnd(0,TAU),d:rnd(0,0.42),s:rnd(1.2,2.6)});
  }
  place(x0,y0,x1,y1,bend){
    const d=Math.hypot(x1-x0,y1-y0)||1;const nx=-(y1-y0)/d,ny=(x1-x0)/d;
    for(let i=0;i<this.n;i++){
      const u=i/(this.n-1);const off=Math.sin(u*TAU)*bend*(0.4+u);
      const p=this.nodes[i];
      p.x=p.px=lerp(x0,x1,u)+nx*off;
      p.y=p.py=lerp(y0,y1,u)+ny*off;
    }
  }
  step(tm,floorY){
    const nd=this.nodes,n=this.n,seg=this.seg;
    const grav=this.attached?0.10:0.85;
    for(let i=0;i<n;i++){
      if(this.attached&&i===0)continue;
      const p=nd[i];
      const vx=(p.x-p.px)*0.97,vy=(p.y-p.py)*0.97;
      p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+grav;
    }
    if(this.attached&&this.pin<0){
      for(let i=4;i<n;i++){
        const p=nd[i];const k=0.035*(i/(n-1));
        p.x+=(this.rest.x-p.x)*k;
        p.y+=(this.rest.y-p.y)*k;
      }
    }
    for(let it=0;it<10;it++){
      if(this.attached){nd[0].x=this.anchor.x;nd[0].y=this.anchor.y;}
      if(this.pin>=0){nd[this.pin].x=this.pinX;nd[this.pin].y=this.pinY;}
      for(let i=0;i<n-1;i++){
        const a=nd[i],b=nd[i+1];
        const dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||0.0001;
        const diff=(d-seg)/d;
        const aF=(this.attached&&i===0)||this.pin===i;
        const bF=this.pin===i+1;
        if(aF&&bF)continue;
        if(aF){b.x-=dx*diff;b.y-=dy*diff;}
        else if(bF){a.x+=dx*diff;a.y+=dy*diff;}
        else{a.x+=dx*diff*0.5;a.y+=dy*diff*0.5;b.x-=dx*diff*0.5;b.y-=dy*diff*0.5;}
      }
      if(!this.attached&&floorY!==null){for(const p of nd){if(p.y>floorY)p.y=floorY;}}
    }
    if(this.attached){nd[0].x=this.anchor.x;nd[0].y=this.anchor.y;}
    if(this.pin>=0){nd[this.pin].x=this.pinX;nd[this.pin].y=this.pinY;}
    if(!this.attached&&floorY!==null){for(const p of nd){if(p.y>=floorY-0.5){p.px=p.x-(p.x-p.px)*0.7;}}}
  }
}
function ropePath(r){
  const nd=r.nodes;
  g.beginPath();g.moveTo(nd[0].x,nd[0].y);
  for(let i=1;i<r.n-1;i++){
    const mx=(nd[i].x+nd[i+1].x)/2,my=(nd[i].y+nd[i+1].y)/2;
    g.quadraticCurveTo(nd[i].x,nd[i].y,mx,my);
  }
  g.lineTo(nd[r.n-1].x,nd[r.n-1].y);
}
function drawRope(r){
  const P=COL[r.color],w=r.w,nd=r.nodes,n=r.n;
  g.save();
  g.lineCap='round';g.lineJoin='round';
  const pt=(k,i)=>({x:nd[i].x+r.cj[k][i].x*w*0.22,y:nd[i].y+r.cj[k][i].y*w*0.22});
  const pathK=k=>{g.beginPath();for(let i=0;i<n;i++){const p=pt(k,i);i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y);}};
  g.globalAlpha=0.5;g.strokeStyle=P.dark;g.lineWidth=w*0.95;pathK(0);g.stroke();
  for(let k=0;k<4;k++){
    g.globalAlpha=0.82;g.lineWidth=w*(0.64-k*0.04);
    if(P.rainbow){
      for(let i=0;i<n-1;i++){
        const a=pt(k,i),b=pt(k,i+1);
        g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);
        g.strokeStyle='hsl('+((i*48)%360)+',85%,'+(54+k*3)+'%)';g.stroke();
      }
    }else{
      g.strokeStyle=P.main;pathK(k);g.stroke();
    }
  }
  g.globalAlpha=0.3;g.strokeStyle=P.dark;g.lineWidth=Math.max(1.5,w*0.12);pathK(2);g.stroke();
  g.restore();
}

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);const r=n>>16,gg=(n>>8)&255,b=n&255;
  const f=v=>Math.round(clamp(amt>=0?v+(255-v)*amt:v*(1+amt),0,255));
  return 'rgb('+f(r)+','+f(gg)+','+f(b)+')';
}

function buildPoly(){
  const hw=rnd(0.9,1.1),sw=rnd(0.94,1.08),hh=rnd(0.96,1.04),gl=rnd(0.92,1.08);
  const h=[[0,-0.98],[0.46*hw,-0.96],[0.78*hw,-0.66],[0.74*hw,-0.28],[1.04*sw,0.04],[1.04*sw*gl,0.6],[0.74*gl,0.96],[0,1.0]];
  const poly=[];
  for(let i=0;i<h.length;i++)poly.push([h[i][0],h[i][1]*hh]);
  for(let i=h.length-2;i>=1;i--)poly.push([-h[i][0],h[i][1]*hh]);
  return poly;
}
function rayR(poly,a){
  const dx=Math.cos(a),dy=Math.sin(a);let tmin=1e9;
  for(let i=0;i<poly.length;i++){
    const p=poly[i],q=poly[(i+1)%poly.length];
    const ex=q[0]-p[0],ey=q[1]-p[1],den=dx*ey-dy*ex;
    if(Math.abs(den)<1e-9)continue;
    const t=(p[0]*ey-p[1]*ex)/den,u=(p[0]*dy-p[1]*dx)/den;

  const n=jars.length,slot=SW/n;

  const bottom=H*0.875,top=bottom-jh;

  }

  creature=mkCreature(heroStyle,SX+SW/2,H*0.37,100,pal);
  layoutPlay();levelR=creature.R;
  const sz=ropeSize(creature.R);
  const list=[];colors.forEach(k=>{for(let q=0;q<PER;q++)list.push(k);});shuffle(list);

  for(let k=0;k<40;k++){anchorsUpdate(creature,ropes);ropes.forEach(r=>r.step(k*0.05,floorY));}
  creature.hopT=1;
  scene='play';
}

/* ---------- map ---------- */
function layoutWorld(){
  const land=W>H*1.15,top=H*0.17,bot=H*0.86;
  const cols=land?4:2,rows=land?2:4;
  const aw=(land?W:SW)*0.92,cw=aw/cols,ch=(bot-top)/rows;
  wsz=Math.min(cw,ch)*0.84;
  const x0=W/2-aw/2;
  const order=land?[[0,1],[1,1],[2,1],[3,1],[3,0],[2,0],[1,0],[0,0]]:[[0,3],[1,3],[1,2],[0,2],[0,1],[1,1],[1,0],[0,0]];
  wpos=order.map(o=>({x:x0+cw*(o[0]+0.5),y:top+ch*(o[1]+0.5)}));
}
const worldBtn=()=>({x:W/2,y:H*0.935,r:Math.min(SW*0.1,H*0.052)});
function enterWorld(done){
  layoutWorld();
  scene='world';held=null;particles.length=0;idle=0;
  hero=mkCreature(heroStyle,0,0,1,heroStyle);
  if(done===undefined){
    worldPhase='ready';worldFrom=worldTo=Math.min(reached,TOTAL-1);worldT=0;
    const sy=reached===0?'Help the Fuzzling get home to the moon!':AREAS[Math.min(reached,TOTAL-1)].say;
    setTimeout(()=>{if(scene==='world')say(sy);},350);
  }else{
    reached=Math.max(reached,done+1);stars[done]=true;starT[done]=0;
    worldFrom=done;worldTo=Math.min(done+1,TOTAL-1);worldPhase='star';worldT=0;
    hero.hopT=1;
    SFX.sparkle();SFX.good();
    const sp=wpos[done];burst(sp.x+wsz*0.3,sp.y-wsz*0.3,'#FFD21F',26);
  }
  const a=wpos[worldFrom];hero.x=a.x;hero.baseY=a.y+wsz*0.06;hero.R=wsz*0.15;hero.y=hero.baseY;
}
function updateWorld(dt){
  layoutWorld();
  worldT+=dt;
  for(let i=0;i<TOTAL;i++)if(starT[i]!==undefined)starT[i]+=dt;
  if(worldPhase==='star'&&worldT>1.3){worldPhase='move';worldT=0;SFX.boing();}
  else if(worldPhase==='move'&&worldT>=1.8){
    worldPhase='ready';worldT=0;worldFrom=worldTo;SFX.sparkle();hero.hopT=1;
    const sp=wpos[worldTo];burst(sp.x,sp.y,'#46C46A',16);
    const sy=AREAS[Math.min(reached,TOTAL-1)].say;setTimeout(()=>{if(scene==='world')say(sy);},200);
  }
  const a=wpos[worldFrom],b=wpos[worldTo];
  let hx=a.x,hy=a.y,hop=0;
  if(worldPhase==='move'){
    const u=clamp(worldT/1.8,0,1),e=u*u*(3-2*u);
    hx=lerp(a.x,b.x,e);hy=lerp(a.y,b.y,e);hop=-Math.abs(Math.sin(u*Math.PI*3))*wsz*0.16;

function jarAt(x,y,loose){
  if(!jars.length)return -1;
  const j0=jars[0];
  if(y<j0.top-(loose?H*0.04:14))return -1;
  for(let i=0;i<jars.length;i++){const j=jars[i];if(x>=j.slotL&&x<j.slotL+j.slotW)return i;}
  return -1;
}
function pickRope(x,y){
  let best=null,bs=1e9;
  for(let ri=ropes.length-1;ri>=0;ri--){
    const r=ropes[ri],hit=Math.max(30,r.w*1.8);
    for(let i=1;i<r.n;i++){
      const d=Math.hypot(r.nodes[i].x-x,r.nodes[i].y-y);
      if(d<hit&&d-ri*0.01<bs){bs=d-ri*0.01;best={r,idx:i};}
    }
  }
  return best;
}
function grabRope(r,idx){
  if(r.attached)idx=Math.max(4,idx);
  r.pin=idx;r.pinX=ptr.x;r.pinY=ptr.y;
  const k=ropes.indexOf(r);if(k>=0){ropes.splice(k,1);ropes.push(r);}
  held={rope:r,mode:'drag',src:-1};
  SFX.swish();
}
function releaseHeld(){
  if(!held)return;
  held.rope.pin=-1;held=null;idle=0;
}
function dropInto(ji){
  const j=jars[ji],r=held.rope;
  if(j.stack.length>=CAP){j.wob=1;SFX.boop();releaseHeld();return;}
  const k=ropes.indexOf(r);if(k>=0)ropes.splice(k,1);
  j.stack.push(r.color);held=null;idle=0;j.glow=1;
  if(r.color===j.color){SFX.good();burst(j.x,j.top+j.h*0.3,COL[r.color].main,14);}
  else{SFX.plop();SFX.boop();j.wob=0.5;}
  checkProgress();
}
function checkProgress(){
  let all=ropes.length===0;
  for(const j of jars){
    const good=j.stack.length===PER&&j.stack.every(k=>k===j.color);
    if(good&&!j.done){j.done=true;SFX.sparkle();burst(j.x,j.top,'#ffd21f',22);creature.hopT=1;}
    if(!good){j.done=false;all=false;}
  }
  if(all&&celebrate===0){
    celebrate=0.001;creature.cheer=true;creature.hopT=1;
    SFX.jingle();say('Hooray! Well done!');
  }
}
function toLearn(){
  const lv=level<LEVELS.length?LEVELS[level]:jars.map(j=>j.color);
  let q=lv.filter(k=>!seen.has(k));
  if(!q.length)q=[lv[Math.floor(Math.random()*lv.length)]];
  q.forEach(k=>seen.add(k));
  learnQ=q;learnI=0;learnT=0;scene='learn';
  setTimeout(()=>{if(scene==='learn')say(COL[learnQ[learnI]].say);},350);
}
function nextCard(){
  learnI++;learnT=0;
  if(learnI>=learnQ.length){hush();if(level>=TOTAL-1)startLaunch();else enterWorld(level);}
  else{say(COL[learnQ[learnI]].say);SFX.sparkle();}
}
function hintMove(){
  if(ropes.length){
    const r=ropes.find(q=>!q.attached)||ropes[0];
    const ti=jars.findIndex(j=>j.color===r.color);
    const e=r.nodes[r.n-1];
    return {fx:e.x,fy:e.y,tx:jars[ti].x,ty:jars[ti].top+jars[ti].h*0.15};
  }
  for(let si=0;si<jars.length;si++){
    const j=jars[si];if(!j.stack.length)continue;
    const top=j.stack[j.stack.length-1];
    if(top!==j.color){
      const ti=jars.findIndex(q=>q.color===top);
      if(ti>=0&&jars[ti].stack.length<CAP)return {fx:j.x,fy:j.top+j.h*0.3,tx:jars[ti].x,ty:jars[ti].top+jars[ti].h*0.15};
    }
  }
  for(let si=0;si<jars.length;si++){
    const j=jars[si];
    if(j.stack.some(k=>k!==j.color)){
      const oi=jars.findIndex((q,qi)=>qi!==si&&q.stack.length<CAP);
      if(oi>=0)return {fx:j.x,fy:j.top+j.h*0.3,tx:jars[oi].x,ty:jars[oi].top+jars[oi].h*0.15};
    }
  }
  return null;
}

function onDown(x,y){
  idle=0;
  if(inC(x,y,btnSnd().x,btnSnd().y,btnSnd().r+8)&&scene!=='intro'||(scene==='intro'&&inC(x,y,btnSnd().x,btnSnd().y,btnSnd().r+8))){toggleSound();return;}
  if(scene==='intro'){
    const b=playBtn();
    if(inC(x,y,b.x,b.y,b.r*1.1)){hush();SFX.boing();enterWorld();return;}
    for(let i=intro.length-1;i>=0;i--){
      const c=intro[i];
      if(Math.hypot(x-c.x,y-c.y)<c.R*1.15){c.hopT=1;SFX.giggle();return;}
    }
    return;
  }
  if(scene==='world'){
    if(inC(x,y,btnHome().x,btnHome().y,btnHome().r+8)){hush();scene='intro';buildIntro();return;}
    if(worldPhase==='ready'){
      const b=worldBtn();
      if(inC(x,y,b.x,b.y,b.r*1.35)){
        hush();SFX.boing();const lv=Math.min(reached,TOTAL-1);startLevel(lv);
        if(lv===0)setTimeout(()=>{if(scene==='play'&&level===0)say('Pull the fuzzy strings off! Then pop them in the jars.');},300);
        return;
      }
    }
    if(hero&&Math.hypot(x-hero.x,y-hero.y)<hero.R*1.6){hero.hopT=1;SFX.giggle();}
    return;
  }
  if(scene==='launch')return;
  if(scene==='home'){
    if(homeT>3.5){const b=homeBtn();if(inC(x,y,b.x,b.y,b.r*1.4)){resetGame();return;}}
    const all=family.concat([hero]);
    for(let i=all.length-1;i>=0;i--){const c=all[i];if(Math.hypot(x-c.x,y-c.y)<c.R*1.3){c.hopT=1;SFX.giggle();break;}}
    return;
  }
  if(scene==='learn'){
    const b=nextBtn();
    if(inC(x,y,b.x,b.y,b.r*1.2)){nextCard();return;}
    SFX.boing();say(COL[learnQ[learnI]].say);
    return;
  }
  if(scene==='play'){
    if(inC(x,y,btnHome().x,btnHome().y,btnHome().r+8)){hush();held=null;scene='intro';buildIntro();return;}
    if(celebrate>0)return;
    if(held&&held.mode==='sel'){
      const ji=jarAt(x,y,false);
      if(ji>=0)dropInto(ji);else dropInto(held.src);
      return;
    }
    const pk=pickRope(x,y);
    if(pk){grabRope(pk.r,pk.idx);return;}
    const ji=jarAt(x,y,false);
    if(ji>=0){
      const j=jars[ji];
      if(y<=j.top+j.h+60&&j.stack.length){
        const color=j.stack.pop();
        const sz=ropeSize(creature.R);
        const r=new Rope(color,sz.seg,sz.w);
        r.attached=false;
        r.place(x,y-sz.seg*7,x,y,0);
        ropes.push(r);
        r.pin=4;r.pinX=x;r.pinY=y;
        held={rope:r,mode:'drag',src:ji};
        SFX.swish();
      }else if(y<=j.top+j.h+60){j.wob=0.4;}
    }
  }
}
function onMove(){
  if(scene==='play'&&held&&held.mode==='drag')idle=0;
}
function onUp(){
  if(scene!=='play'||!held||held.mode!=='drag')return;
  idle=0;
  const r=held.rope;
  const moved=Math.hypot(ptr.x-ptr.sx,ptr.y-ptr.sy),dtm=performance.now()-ptr.st;
  if(held.src>=0&&moved<14&&dtm<450){held.mode='sel';r.pin=4;SFX.tap();return;}
  if(r.attached&&moved<10){creature.hopT=1;SFX.boing();releaseHeld();return;}
  const ji=(ptr.y>=floorY-6)?jarAt(ptr.x,ptr.y,true):-1;
  if(ji>=0)dropInto(ji);else releaseHeld();
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(ptr.id!==null)return;
  ptr.id=e.pointerId;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  unlockAudio();
  ptr.x=ptr.sx=e.clientX;ptr.y=ptr.sy=e.clientY;ptr.st=performance.now();ptr.down=true;
  onDown(ptr.x,ptr.y);
});
cv.addEventListener('pointermove',e=>{
  if(ptr.id!==null&&e.pointerId!==ptr.id)return;
  ptr.x=e.clientX;ptr.y=e.clientY;
  if(ptr.down)onMove();
});
const upH=e=>{
  if(e.pointerId!==ptr.id)return;
  ptr.down=false;ptr.id=null;
  onUp();
};
cv.addEventListener('pointerup',upH);
cv.addEventListener('pointercancel',upH);
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)hush();});
window.addEventListener('resize',resize);
['touchend','click','pointerup','keydown'].forEach(ev=>document.addEventListener(ev,function h(){
  unlockAudio();
  if(AC&&AC.state==='running')document.removeEventListener(ev,h);
},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC){try{AC.resume();}catch(e){}}});

/* ---------- update ---------- */
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}
    p.vy+=(p.g!==undefined?p.g:(p.kind==='rect'?60:420))*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.kind==='rect')p.rot+=p.vr*dt;
    if(p.kind==='smoke')p.r+=dt*26;
  }
}
function update(dt){
  updateParticles(dt);
  if(scene==='intro'){
    layoutIntro();
    intro.forEach(c=>{updateCreature(c,dt);anchorsUpdate(c,c.ropes);c.ropes.forEach(r=>r.step(t,null));});
    return;
  }
  if(scene==='world'){updateWorld(dt);return;}
  if(scene==='launch'){updateLaunch(dt);return;}
  if(scene==='home'){updateHome(dt);return;}
  if(scene==='learn'){learnT+=dt;return;}
  if(scene==='play'){
    layoutPlay();
    if(!celebrate&&levelR&&Math.abs(creature.R/levelR-1)>0.22){startLevel(level);return;}
    updateCreature(creature,dt);
    anchorsUpdate(creature,ropes);
    if(held&&held.mode==='drag'){
      const r=held.rope;r.pinX=ptr.x;r.pinY=ptr.y;
      if(r.attached){
        const d=Math.hypot(ptr.x-r.anchor.x,ptr.y-r.anchor.y);
        if(d>r.seg*r.pin*0.9){
          r.attached=false;SFX.pop();
          burst(r.anchor.x,r.anchor.y,COL[r.color].main,8);
          creature.hopT=Math.max(creature.hopT,0.0001);
        }
      }
    }else if(held&&held.mode==='sel'){
      const j=jars[held.src];
      held.rope.pinX=j.x;held.rope.pinY=j.top-j.h*0.3+Math.sin(t*5)*4;
    }
    ropes.forEach(r=>r.step(t,floorY));
    jars.forEach(j=>{j.wob=Math.max(0,j.wob-dt*1.6);j.glow=Math.max(0,j.glow-dt*2.5);});
    if(!held&&!celebrate)idle+=dt;
    if(celebrate>0){
      celebrate+=dt;
      confetti();confetti();
      if(creature.hopT<=0)creature.hopT=1;
      if(celebrate>3.2)toLearn();
    }
  }
}

/* ---------- draw ---------- */
function drawTitle(txt,cxp,y,size){
  g.save();
  g.font='900 '+size+'px '+FONT;g.textBaseline='middle';g.textAlign='center';g.lineJoin='round';
  const chars=[...txt],widths=chars.map(ch=>g.measureText(ch).width);
  const total=widths.reduce((a,b)=>a+b,0);
  let x=cxp-total/2;
  const order=['joy','love','calm','sadness','rage','fear'];
  chars.forEach((ch,i)=>{
    const P=COL[order[i%6]];
    g.save();
    g.translate(x+widths[i]/2,y+Math.sin(t*3+i*0.7)*size*0.06);
    g.rotate(Math.sin(t*2.4+i)*0.07);
    g.lineWidth=size*0.14;g.strokeStyle=P.dark;g.strokeText(ch,0,0);
    g.fillStyle=P.main;g.fillText(ch,0,0);
    g.restore();
    x+=widths[i];
  });
  g.restore();
}
function drawCircleBtn(b,emoji){
  g.save();
  g.beginPath();g.arc(b.x,b.y,b.r,0,TAU);g.fillStyle='#fff';g.fill();
  g.lineWidth=3;g.strokeStyle='#D6DBE8';g.stroke();
  g.font=Math.round(b.r*0.95)+'px '+EMOJI;g.textAlign='center';g.textBaseline='middle';
  g.fillText(emoji,b.x,b.y+2);
  g.restore();
}
function drawGoBtn(b){
  const s=1+Math.sin(t*4)*0.05;
  g.save();g.translate(b.x,b.y);g.scale(s,s);
  g.beginPath();g.arc(0,b.r*0.08,b.r,0,TAU);g.fillStyle='#2A9248';g.fill();
  g.beginPath();g.arc(0,0,b.r,0,TAU);g.fillStyle='#46C46A';g.fill();
  g.beginPath();g.moveTo(-b.r*0.25,-b.r*0.42);g.lineTo(b.r*0.5,0);g.lineTo(-b.r*0.25,b.r*0.42);g.closePath();
  g.fillStyle='#fff';g.strokeStyle='#fff';g.lineJoin='round';g.lineWidth=b.r*0.12;g.fill();g.stroke();
  g.restore();
}
function drawParticles(){
  for(const p of particles){
    g.save();
    g.globalAlpha=clamp(p.life/Math.min(p.max,0.6),0,1)*(p.kind==='smoke'?0.5:1);
    g.fillStyle=p.color;
    if(p.kind==='rect'){g.translate(p.x,p.y);g.rotate(p.rot);g.fillRect(-p.r,-p.r*0.5,p.r*2,p.r);}
    else if(p.kind==='heart'){heart(p.x,p.y,p.r*1.6);}
    else{g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.fill();}
    g.restore();
  }
}
function wrapText(txt,maxW){
  const words=txt.split(' '),lines=[];let cur='';
  for(const w of words){
    const test=cur?cur+' '+w:w;
    if(g.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;
  }
  if(cur)lines.push(cur);
  return lines;
}
function drawIntro(){
  drawTitle('Fuzzlings',W/2,H*0.13,Math.min(SW*0.155,H*0.1));
  g.save();g.font='700 '+Math.round(Math.min(SW*0.05,H*0.032))+'px '+FONT;g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#8A8FA8';g.fillText('colours & feelings',W/2,H*0.13+Math.min(SW*0.155,H*0.1)*0.85);g.restore();
  intro.forEach(c=>{
    drawBody(c,t);
    c.ropes.forEach(drawRope);
    drawCreatureFace(c,1,t);
  });
  drawGoBtn(playBtn());
  drawCircleBtn(btnSnd(),muted?'\uD83D\uDD07':'\uD83D\uDD0A');
}
function drawPlay(){
  drawScene(level,0,0,W,H,0.42,t,true);
  drawBody(creature,t);
  ropes.filter(r=>r.attached).forEach(drawRope);
  const f=ropes.filter(r=>r.attached).length/(jars.length*PER);
  drawCreatureFace(creature,f,t);
  const hov=(held&&held.mode==='drag'&&ptr.y>=floorY-6)?jarAt(ptr.x,ptr.y,true):-1;
  jars.forEach((j,i)=>drawJar(j,i===hov));
  jars.forEach(j=>{
    const r=Math.min(j.w*0.3,28);
    drawBadge(j.color,j.x,j.top+j.h+r*1.4+6,r);
  });
  ropes.filter(r=>!r.attached).forEach(drawRope);
  if(idle>4.5&&!held&&!celebrate){
    const hm=hintMove();
    if(hm){
      const u=(t*0.55)%1.7,p=clamp(u/1.1,0,1),e=p*p*(3-2*p);
      const x=lerp(hm.fx,hm.tx,e),y=lerp(hm.fy,hm.ty,e);
      g.save();g.globalAlpha=u>1.4?clamp((1.7-u)/0.3,0,1):1;
      g.font='44px '+EMOJI;g.textAlign='center';g.textBaseline='middle';
      g.fillText('\uD83D\uDC46',x,y+26);g.restore();
    }
  }
  drawParticles();
  if(celebrate>0)drawTitle('Hooray!',W/2,H*0.13,Math.min(SW*0.2,H*0.12));
  drawCircleBtn(btnHome(),'\uD83C\uDFE0');
  drawCircleBtn(btnSnd(),muted?'\uD83D\uDD07':'\uD83D\uDD0A');
  const n=LEVELS.length,sp=22,x0=W/2-(n-1)*sp/2;
  for(let i=0;i<n;i++){
    const done=level>=n||i<level;
    g.beginPath();g.arc(x0+i*sp,46,7,0,TAU);
    g.fillStyle=done?'#FFCF1F':'#fff';g.fill();
    g.lineWidth=3;g.strokeStyle=(i===level%n&&level<n)?'#46C46A':'#D6DBE8';g.stroke();
  }
}
function drawLearn(){
  const k=learnQ[learnI],P=COL[k];
  const cw=SW*0.9,ch=H*0.62,cx0=W/2-cw/2,cy0=H*0.1;
  const s=easeOutBack(clamp(learnT/0.45,0,1));
  g.save();
  g.translate(W/2,cy0+ch/2);g.scale(s,s);g.translate(-W/2,-(cy0+ch/2));
  g.save();g.shadowColor='rgba(40,50,90,0.15)';g.shadowBlur=26;g.shadowOffsetY=8;
  rr(cx0,cy0,cw,ch,34);g.fillStyle='#fff';g.fill();g.restore();
  rr(cx0,cy0,cw,ch,34);g.lineWidth=8;g.strokeStyle=P.rainbow?'#B07CF0':P.main;g.stroke();
  const br=Math.min(cw*0.2,ch*0.17);
  const by=cy0+ch*0.21+Math.sin(t*4)*4;
  drawBadge(k,W/2,by,br);
  const tf=Math.min(cw*0.13,ch*0.1);
  g.textAlign='center';g.textBaseline='middle';
  g.font='900 '+tf+'px '+FONT;g.lineJoin='round';
  g.lineWidth=tf*0.12;g.strokeStyle=P.dark;g.strokeText(P.name,W/2,cy0+ch*0.42);
  g.fillStyle=P.rainbow?'#B07CF0':P.main;g.fillText(P.name,W/2,cy0+ch*0.42);
  g.font='800 '+Math.round(tf*0.55)+'px '+FONT;g.fillStyle='#6B7090';
  g.fillText(P.word,W/2,cy0+ch*0.42+tf*0.85);
  const es=Math.min(cw*0.17,ch*0.13);
  g.font=Math.round(es)+'px '+EMOJI;
  P.items.forEach((em,i)=>{g.fillText(em,W/2+(i-1)*cw*0.28,cy0+ch*0.64+Math.sin(t*3+i*1.3)*6);});
  const fs=Math.max(13,Math.min(22,ch*0.042));
  g.font='700 '+fs+'px '+FONT;g.fillStyle='#4B4F6B';
  const lines=wrapText(P.text,cw*0.84);
  lines.forEach((ln,i)=>g.fillText(ln,W/2,cy0+ch*0.8+i*fs*1.35));
  g.restore();
  drawGoBtn(nextBtn());
  drawCircleBtn(btnSnd(),muted?'\uD83D\uDD07':'\uD83D\uDD0A');
}
let pageBg='#fff';
function draw(){
  const pb=(scene==='launch'||scene==='home')?'#000':'#fff';
  if(pb!==pageBg){pageBg=pb;document.body.style.background=pb;document.documentElement.style.background=pb;}
  g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  if(scene==='intro')drawIntro();
  else if(scene==='play')drawPlay();
  else if(scene==='learn'){drawLearn();drawParticles();}
  else if(scene==='world')drawWorld();
  else if(scene==='launch')drawLaunch();
  else if(scene==='home')drawHome();
  g.save();g.font='11px '+FONT;g.textAlign='left';g.textBaseline='alphabetic';
  g.fillStyle='rgba(120,125,150,0.55)';g.fillText('v'+VERSION,10,H-10);g.restore();
}
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0.016);
  last=ts;t+=dt;
  update(dt);draw();
  requestAnimationFrame(frame);
}

resize();
buildIntro();
requestAnimationFrame(ts=>{last=ts;frame(ts);});
})();
</script>
